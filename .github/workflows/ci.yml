name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        shell: pwsh
        run: |
          node --check standalone/main.js
          node --check standalone/preload.js
          node --check standalone/renderer/app.js
          node --check standalone/renderer/ux-fixes.js
          node --check standalone/renderer/home-compat.js
          node --check standalone/core/ini.js
          node --check standalone/core/download.js
          node --check standalone/core/file-state.js
          node --check standalone/core/game-scan.js
          node --check standalone/core/route-plan.js
          node --check standalone/core/game-process.js
          node --check standalone/core/backend-update.js
          node --check standalone/core/discovery.js
          node --check standalone/core/runtime.js
          node --check standalone/core/sr-runtime.js
          node --check standalone/core/optiscaler.js
          node --check standalone/core/nr-settings.js
          node --check standalone/core/derived/pe.js
          node --check standalone/core/derived/library.js
          node --check scripts/test-standalone-library-ui.js
          python -m py_compile scripts/patch-optiscaler-compact-overlay.py
          python -m py_compile scripts/fix-optiscaler-manager-overlay-compile.py
      - name: Unit and renderer tests
        run: npm test

  build-windows-preview:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Checkout pinned OptiScaler NR v0.8.5 source
        uses: actions/checkout@v4
        with:
          repository: wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass
          ref: 0dfd181a4e5e3bd0cdf9b5a2e75530fc616ad0b6
          path: _backend
          submodules: recursive
      - name: Patch DLSS5 Before Upscaling in-game overlay
        run: |
          python scripts/patch-optiscaler-compact-overlay.py _backend
          python scripts/fix-optiscaler-manager-overlay-compile.py _backend
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build custom OptiScaler backend
        shell: pwsh
        run: msbuild _backend/OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false /verbosity:minimal
      - name: Stage custom backend payload
        shell: pwsh
        run: |
          Push-Location _backend
          ./package_release.ps1 -Version dlss5mgr30 -SkipBuild
          Pop-Location
          $dst = 'standalone/backend-payload'
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive '_backend/release/OptiScaler-NR-dlss5mgr30.zip' -DestinationPath $dst -Force
          @"
          Custom backend for DLSS5 Before Upscaling.
          Upstream: wilsjo2/OptiScaler-DLSSNR-PreSR-Multipass
          Upstream commit: 0dfd181a4e5e3bd0cdf9b5a2e75530fc616ad0b6 (release v0.8.5)
          Visible manager overlay patch: scripts/patch-optiscaler-compact-overlay.py
          Manager overlay integration patch: scripts/fix-optiscaler-manager-overlay-compile.py
          The older v0.7.7 NGX compatibility experiments are intentionally not applied.
          Neural Rendering is handled by the current v0.8.5 backend; its obsolete nvngx.dll_dlssnr.dll helper is not used.
          OptiScaler remains licensed under GPL-3.0; see LICENSE.
          "@ | Set-Content "$dst/DLSS5-BEFORE-UPSCALING-BACKEND.txt" -Encoding UTF8
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate staged custom backend
        shell: pwsh
        run: node -e "require('./standalone/core/optiscaler').validatePackage(require('path').resolve('standalone/backend-payload')); console.log('custom backend payload valid')"
      - name: Build Windows portable preview
        run: npm run build:portable
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5-Before-Upscaling-Windows-preview
          path: dist-standalone/DLSS5-Before-Upscaling.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload backend source patch
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5-Before-Upscaling-OptiScaler-source-patch
          path: |
            scripts/patch-optiscaler-compact-overlay.py
            scripts/fix-optiscaler-manager-overlay-compile.py
            standalone/backend-payload/DLSS5-BEFORE-UPSCALING-BACKEND.txt
          retention-days: 14


  release-v0-1-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.1.0'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested Windows build from CI #119
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35534942524 --repo "${{ github.repository }}" --name "DLSS5-Before-Upscaling-Windows-preview" --dir release-bin
          gh run download 35534942524 --repo "${{ github.repository }}" --name "DLSS5-Before-Upscaling-OptiScaler-source-patch" --dir release-source

      - name: Prepare release assets
        shell: pwsh
        run: |
          Compress-Archive -Path "release-source/*" -DestinationPath "DLSS5-Before-Upscaling-OptiScaler-source-patch.zip" -Force
          $exe = "release-bin/DLSS5-Before-Upscaling.exe"
          $src = "DLSS5-Before-Upscaling-OptiScaler-source-patch.zip"
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $srcHash = (Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
          @"
          $exeHash  DLSS5-Before-Upscaling.exe
          $srcHash  DLSS5-Before-Upscaling-OptiScaler-source-patch.zip
          "@ | Set-Content "SHA256SUMS.txt" -Encoding ascii

      - name: Publish v0.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## DLSS5 Before Upscaling v0.1.0

          First formal release of DLSS5 Before Upscaling.

          ### Highlights
          - Per-game DLSS 5 Neural Rendering profiles
          - Native DLSS Pre-SR detection, including DLSS runtimes outside the main EXE directory
          - Supported temporal FSR/XeSS routing to managed DLSS Super Resolution
          - 1–3 independent Neural Rendering passes
          - Standard, Natural and Cinematic styles per active pass
          - In-game Insert overlay for image-dependent tuning
          - Launcher discovery plus folder-based/manual game addition
          - Steam artwork plus local non-Steam artwork discovery with EXE-icon fallback
          - English and Simplified Chinese UI
          - Portable Windows build

          ### Runtime
          nvngx_dlssnr.dll is not redistributed. When required, the app asks you to select a trusted local copy and validates it locally.

          ### Compatibility
          Game compatibility varies by title, rendering path and game updates. The app does not bypass or disable anti-cheat systems.

          ### Files
          - DLSS5-Before-Upscaling.exe — portable Windows application
          - DLSS5-Before-Upscaling-OptiScaler-source-patch.zip — source/patch material for the managed backend
          - SHA256SUMS.txt — SHA-256 checksums
          "@ | Set-Content "release-notes.md" -Encoding utf8

          gh release create v0.1.0 "release-bin/DLSS5-Before-Upscaling.exe#DLSS5-Before-Upscaling.exe" "DLSS5-Before-Upscaling-OptiScaler-source-patch.zip#DLSS5-Before-Upscaling-OptiScaler-source-patch.zip" "SHA256SUMS.txt#SHA256SUMS.txt" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DLSS5 Before Upscaling v0.1.0" --notes-file "release-notes.md" --latest
